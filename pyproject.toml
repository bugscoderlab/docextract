[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docextract"
version = "0.1.0"
description = "A domain-free LangChain extraction engine: schema in, cached, correction-aware."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
# provider packages — install the one your model needs
providers = ["langchain>=0.3", "langchain-google-genai>=2"]
# SQLModel-backed cache + correction store
sqlmodel = ["sqlmodel>=0.0.22", "sqlalchemy>=2"]
# FastAPI router factory
api = ["fastapi>=0.110"]
# S3-compatible source-Document store
s3 = ["boto3>=1.34"]
# Alembic migrations for the engine's tables
migrations = ["alembic>=1.13", "sqlmodel>=0.0.22"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/docextract"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
